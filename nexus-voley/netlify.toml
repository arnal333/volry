[build]
  publish = "."
  functions = "functions"

# Proxy al endpoint de la función AI
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# Proxy al seed
[[redirects]]
  from = "/api/seed"
  to = "/.netlify/functions/seed"
  status = 200
  force = true

# SPA — todas las rutas van al index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
